<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro — UI Prototipi (mock)</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfcfd; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --blue:#2563eb; --blue-bg:#dbeafe; --green:#16a34a; --green-bg:#dcfce7;
  --amber:#d97706; --amber-bg:#fef3c7; --red:#dc2626; --red-bg:#fee2e2;
  --purple:#7c3aed; --purple-bg:#ede9fe; --teal:#0f766e; --teal-bg:#ccfbf1;
  --orange:#ea580c; --orange-bg:#ffedd5;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0b1120; --panel:#111827; --panel2:#0f172a; --border:#1f2937; --border2:#334155;
  --text:#e5e7eb; --muted:#94a3b8; --faint:#64748b;
  --blue:#60a5fa; --blue-bg:#1e293b; --green:#4ade80; --green-bg:#052e1b;
  --amber:#fbbf24; --amber-bg:#3b2c07; --red:#f87171; --red-bg:#3b1113;
  --purple:#a78bfa; --purple-bg:#2a1e4d; --teal:#2dd4bf; --teal-bg:#0b3b37;
  --orange:#fb923c; --orange-bg:#3a1e0b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand b{font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--faint);font-size:11px;font-weight:400}
.navgroup{margin:12px 0 4px;padding:0 10px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:600}
.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;margin-bottom:1px}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav .ic{width:16px;text-align:center;font-size:13px}
.nav .cnt{margin-left:auto;background:var(--border);color:var(--muted);border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.nav.active .cnt{background:var(--blue);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:17px;font-weight:650}
.top .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.content{padding:20px 22px 60px;max-width:1400px;width:100%}

/* atoms */
.btn{border:1px solid var(--border2);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow)}
.card .hd{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card .hd h3{margin:0;font-size:14px;font-weight:640}
.card .hd .sub{color:var(--muted);font-size:12px;font-weight:400}
.card .bd{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.g2,.g3,.g4{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-blue{background:var(--blue-bg);color:var(--blue)} .t-green{background:var(--green-bg);color:var(--green)}
.t-amber{background:var(--amber-bg);color:var(--amber)} .t-red{background:var(--red-bg);color:var(--red)}
.t-purple{background:var(--purple-bg);color:var(--purple)} .t-gray{background:var(--border);color:var(--muted)}
.t-teal{background:var(--teal-bg);color:var(--teal)} .t-orange{background:var(--orange-bg);color:var(--orange)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi{padding:14px 15px}
.kpi .lbl{color:var(--muted);font-size:12px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:680;letter-spacing:-.5px}
.kpi .note{font-size:11.5px;color:var(--faint);margin-top:4px;background:none;border:none;padding:0;border-radius:0}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click:hover{background:var(--panel2);cursor:pointer}
.scroll{overflow-x:auto}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);padding:0 15px;flex-wrap:wrap}
.tab{padding:9px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);align-items:flex-start}
.step:last-child{border-bottom:none}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:2px solid var(--border2);color:var(--muted);background:var(--panel)}
.step.done .num{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.step.now .num{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px var(--amber-bg)}
.step .ti{font-weight:600;font-size:13.5px}
.step .de{color:var(--muted);font-size:12.5px;margin-top:2px}
.step.wait .ti{color:var(--faint)}

.log{background:#0b1120;color:#cbd5e1;border-radius:9px;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.65;height:280px;overflow-y:auto;border:1px solid #1f2937}
.log .l-i{color:#93c5fd}.log .l-ok{color:#4ade80}.log .l-w{color:#fbbf24}.log .l-e{color:#f87171}.log .l-d{color:#64748b}
.bar{height:7px;background:var(--border);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px}
.hint{background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);border-radius:9px;padding:10px 13px;font-size:12.5px}
.note{background:var(--panel2);border:1px dashed var(--border2);border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal-bg.on{display:grid}
.modal{background:var(--panel);border-radius:13px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:86vh;overflow:auto}
.switch{width:38px;height:21px;border-radius:20px;background:var(--border2);position:relative;transition:.15s;border:none;flex:none}
.switch>i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--green)}.switch.on>i{left:19px}
.sel,.inp{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 9px;border-radius:7px;font:inherit;font-size:13px;width:100%}
.chip{display:inline-block;padding:3px 9px;border:1px solid var(--border2);border-radius:20px;font-size:12px;color:var(--muted);background:var(--panel2)}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:600}
.tree{font-size:13px}
.tree .it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--muted)}
.tree .it:hover{background:var(--panel2);cursor:pointer;color:var(--text)}
.tree .it.sel{background:var(--blue-bg);color:var(--blue);font-weight:600}
.tree .lvl2{padding-left:24px}
.jira{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:11px}
.jira .who{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
.adf{border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--panel)}
.adf .ah{padding:8px 12px;background:var(--blue-bg);color:var(--blue);font-weight:650;font-size:12.5px;border-bottom:1px solid var(--border2)}
.adf .ab{padding:11px 12px;font-size:13px}
.mini{font-size:11.5px;color:var(--faint)}
.flowbox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px}
.fb{padding:6px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--panel2)}
.fb.on{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600}
.arrow{color:var(--faint)}
.issue{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);margin-bottom:9px}
.issue .no{font-weight:700;color:var(--faint);font-size:12px;min-width:26px}

/* prod-like ekler */
.toastwrap{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;
 padding:11px 15px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:360px;animation:tin .25s ease}
.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.searchwrap{position:relative}
.searchwrap input{width:230px;padding:7px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px}
.searchdrop{position:absolute;top:36px;right:0;width:340px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
 box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:60;max-height:320px;overflow:auto;display:none}
.searchdrop.on{display:block}
.searchdrop .it{padding:9px 13px;border-bottom:1px dashed var(--border);cursor:pointer;font-size:13px}
.searchdrop .it:hover{background:var(--panel2)}
.lvwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.lvwrap{grid-template-columns:1fr}}
.lvpane{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.lvpane .ph{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:650;font-size:13px;display:flex;gap:8px;align-items:center;background:var(--panel2)}
.lvbody{padding:12px;min-height:340px;max-height:480px;overflow:auto;display:flex;flex-direction:column;gap:9px}
.lvterm{font-family:ui-monospace,monospace;font-size:12px;background:#0b1220;color:#cbd5e1;min-height:340px;max-height:480px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.gatebtn{display:inline-block;margin-top:8px;padding:7px 13px;border-radius:8px;background:var(--green);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600}
.pulse{animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.wiz{display:flex;gap:0;margin-bottom:16px}
.wiz .w{flex:1;text-align:center;padding:9px 6px;font-size:12.5px;border-bottom:3px solid var(--border);color:var(--faint)}
.wiz .w.on{border-color:var(--blue);color:var(--text);font-weight:650}
.wiz .w.done{border-color:var(--green);color:var(--green)}

/* şablon tasarımcısı (M108) */
.seclist .row{display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--border);border-radius:9px;
 margin-bottom:7px;background:var(--panel2);cursor:pointer}
.seclist .row:hover{border-color:var(--border2)}
.seclist .row.sel{border-color:var(--blue);background:var(--blue-bg)}
.seclist .row .gr{color:var(--faint);cursor:grab;font-size:13px;flex:none}
.seclist .row .tt{font-size:13px;font-weight:600;line-height:1.35}
.seclist .row.sel .tt{color:var(--blue)}
.iconb{border:1px solid var(--border2);background:var(--panel);border-radius:6px;width:22px;height:22px;
 display:grid;place-items:center;font-size:11px;color:var(--muted);padding:0;flex:none;line-height:1}
.iconb:hover{border-color:var(--muted);color:var(--text)}
.iconb.dl:hover{border-color:var(--red);color:var(--red)}

/* doküman şablonu (M103r) — A4 oranlı kağıt önizlemesi */
.drop{border:2px dashed var(--border2);border-radius:11px;padding:20px;text-align:center;background:var(--panel2)}
.drop:hover{border-color:var(--blue)}
.paper{background:#fff;color:#111827;border:1px solid #cbd5e1;border-radius:3px;box-shadow:0 6px 20px rgba(15,23,42,.20);
 padding:20px 22px;font-family:"Times New Roman",Georgia,serif;font-size:10.5px;line-height:1.6;
 aspect-ratio:1/1.414;overflow:hidden;display:flex;flex-direction:column}
.paper .ph{border-bottom:1px solid #d1d5db;padding-bottom:5px;margin-bottom:10px;display:flex;justify-content:space-between;
 font-size:8.5px;color:#6b7280;font-family:system-ui,sans-serif}
.paper .pf{border-top:1px solid #d1d5db;padding-top:5px;margin-top:auto;display:flex;justify-content:space-between;
 font-size:8.5px;color:#6b7280;font-family:system-ui,sans-serif}
.paper h4{font-size:15px;font-weight:700;margin:0 0 5px;color:#111827}
.paper h5{font-size:10.5px;font-weight:700;margin:9px 0 3px;color:#111827}
.paper p{margin:0 0 5px}
.paper table{border-collapse:collapse;width:100%;margin-top:4px}
.paper th,.paper td{border:1px solid #9ca3af;padding:3px 5px;font-size:8.5px;color:#111827;
 text-transform:none;letter-spacing:0;font-weight:400;font-family:system-ui,sans-serif;text-align:left}
.paper th{background:#f1f5f9;font-weight:700}
.paper .logo-slot{width:74px;height:40px;border:1px dashed #94a3b8;display:grid;place-items:center;
 font-size:8px;color:#94a3b8;font-family:system-ui,sans-serif}
.slot{background:#eff6ff;outline:1px dashed #93c5fd;border-radius:2px;padding:0 3px;color:#1d4ed8;
 font-family:ui-monospace,monospace;font-size:8.5px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">M</div>
      <div><b>Maestro</b><small>UI prototipi · mock veri</small></div>
    </div>
    <div id="nav"></div>
    <div style="margin-top:18px;padding:10px;border-radius:9px;background:var(--panel2);border:1px dashed var(--border2)">
      <div class="mini" style="margin-bottom:7px">Bu bir <b>tıklanabilir maket</b>. Veriler sahte, kod yok.</div>
      <div style="display:flex;gap:6px"><button class="btn sm" style="flex:1" onclick="toggleTheme()">🌓 Tema</button>
      <button class="btn sm" style="flex:1" title="İki dilli arayüz (M60) — makette temsilî" onclick="this.textContent=this.textContent.includes('TR')?'🌐 EN':'🌐 TR'">🌐 TR</button></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="ttl">—</h1><div class="sub" id="sub">—</div></div>
      <div class="spacer"></div>
      <div class="searchwrap"><input id="gsearch" placeholder="🔍 Ticket ara…  (ör. UGURWEB)" oninput="gSearch(this.value)" onblur="setTimeout(()=>$('#sdrop').classList.remove('on'),200)">
       <div class="searchdrop" id="sdrop"></div></div>
      <button class="btn sm" onclick="showNotifs()" title="Bildirimler">🔔 <span id="bellcnt">4</span></button>
      <span class="tag t-green"><span class="dot" style="background:currentColor"></span> Sistem sağlıklı</span>
      <span class="tag t-gray">👤 Uğur Yıldız · admin</span>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="modal-bg" id="mbg" onclick="if(event.target.id==='mbg')closeModal()"><div class="modal" id="mbox"></div></div>

<script>
/* ============ MOCK VERİ ============ */
const JPROJ=[
 {p:"UGURPAY",trg:"otomatik",apps:["ugurpay"],note:"fan-out hedefleri: tüm uygulamalar (analizden)"},
 {p:"UGURWEB",trg:"opt-in (label: maestro)",apps:["ugurweb"],note:""},
 {p:"UGURMOB",trg:"opt-in (/ai-start)",apps:["ios","android"],note:"component ayrıştırır · component yoksa AI önerisi (kademe 2)"},
 {p:"UGURDESK",trg:"otomatik",apps:["desktop"],note:""},
 {p:"UGURKREDI",trg:"—",apps:[],note:"yeni proje · onboarding sürüyor (adım 3/4)"}
];
const APPS = {
  ugurpay:{name:"ugurpay",stack:"Next.js",platform:"linux-node",repo:"Odeme/_git/ugurpay",comp:"pay-web/api"},
  ugurweb:{name:"ugurweb",stack:"React",platform:"linux-node",repo:"Web/_git/ugurweb",comp:"web"},
  ios:{name:"ugurmobil-ios",stack:"Swift/Xcode",platform:"macos-xcode",repo:"Mobil/_git/ugurmobil-ios",comp:"ios"},
  android:{name:"ugurmobil-android",stack:"Kotlin/Gradle",platform:"linux-android",repo:"Mobil/_git/ugurmobil-android",comp:"android"},
  desktop:{name:"ugurmasaüstü",stack:"C#/.NET",platform:"windows-dotnet",repo:"Sube/_git/ugurmasaustu",comp:"sube-masaustu"}
};
/* Eşleme kuralları (kademe ① — M99). Tek kaynak: routing ekranı da matchInfo da BURADAN okur. */
const RULES=[
 {n:1,p:"UGURPAY",cond:"her ticket",app:"ugurpay",mode:"full_auto"},
 {n:2,p:"UGURWEB",cond:"her ticket",app:"ugurweb",mode:"full_auto"},
 {n:3,p:"UGURMOB",cond:"component=ios",comp:"ios",app:"ios",mode:"full_auto"},
 {n:4,p:"UGURMOB",cond:"component=android",comp:"android",app:"android",mode:"full_auto"},
 {n:5,p:"UGURMOB",cond:"component YOK",app:null,mode:null,note:"→ kademe ② (AI önerisi)"},
 {n:6,p:"UGURDESK",cond:"her ticket",app:"desktop",mode:"full_auto"},
 {n:7,p:"*",cond:"label=musteri-verisi",app:null,mode:"human_lead",note:"(veri sınıfı: gizli)"}
];
const STEPS = [
 ["0","Work mode seçimi","Jira label / RoutingRule"],
 ["2","Intake","Ticket tamlık kontrolü (AI)"],
 ["2b","Clarification","Reporter'a soru — süresiz bekleme"],
 ["3ö","Repo keşfi","Agent SDK salt-okunur oturum"],
 ["3","Analyst","Şablona göre analiz + etki matrisi (AI)"],
 ["4","PO onayı","İnsan kapısı · grup doğrulamalı"],
 ["5","Tech Lead onayı","İnsan kapısı · SoD (4-göz)"],
 ["6a","Geliştirme","Agent SDK oturumu — runner'da"],
 ["6b","Güvenlik taraması","gitleaks · semgrep · trivy (fail-closed)"],
 ["6c","Dev-reviewer","Gerçek diff incelemesi (AI)"],
 ["7","Test-designer","Gherkin senaryolar (AI)"],
 ["8","Test-reviewer","4-göz kapsam denetimi (AI)"],
 ["9","QA onayı","İnsan kapısı"],
 ["10","Test-engineer","Testler GERÇEKTEN koşar"],
 ["10b","CI gate","ADO build validation → sinyal"],
 ["11","QA sonuç onayı","İnsan kapısı"],

 {id:4,t:"Kabul kriterleri",d:"Ölçülebilir, test edilebilir kabul maddeleri (en az 3)",req:1,fmt:"madde listesi",
  ai:"Her madde tek bir doğrulanabilir davranış olsun ve bir testle karşılanabilsin. 'İyi çalışmalı' gibi ölçülemez ifade yasak. Geriye uyum maddesini unutma.",

 {id:5,t:"Ekran / API değişiklikleri",d:"Kullanıcıya ve entegrasyona görünen yüzey",req:0,fmt:"tablo",

V.template=()=>({t:"Analiz şablonu — tasarımcı",s:"Şablon Studio'da TASARLANIR (M108) · analyst çıktısı bu tanımdan üretilen şemayla doğrulanır",h:`
<div class="card" style="margin-bottom:14px">
 <div class="bd" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
  <div><label class="mini" style="display:block;margin-bottom:3px">Şablon adı</label><input class="inp" style="width:240px" value="${esc(TNAME)}" oninput="TNAME=this.value"></div>
  <div style="display:flex;gap:7px;align-items:center;padding-bottom:7px">
   <span class="tag t-blue" id="tverbadge">sürüm v${TVER}</span><span class="tag t-green">aktif</span>
   <span class="mini">son değişiklik: Ayşe K. · 3 gün önce</span></div>
  <span class="spacer" style="flex:1"></span>
  <button class="btn" onclick="tPreview()">👁 Önizle</button>
  <button class="btn" onclick="location.hash='doctemplate'">📄 Word çıktısı</button>

 </div>
 <div class="bd" style="border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <span class="mini">Bu şablonu kullanan projeler:</span>
  ${TPROJ.map(([p,v])=>`<span class="chip${v.startsWith("v"+TVER)?" on":""}">${p} · ${v}</span>`).join("")}
 </div>
</div>
<div class="grid" style="grid-template-columns:330px 1fr;align-items:start">
 <div class="card">
  <div class="hd"><h3>Bölümler (<span id="tcount">${TSECS.length}</span>)</h3>
   <span class="spacer" style="flex:1"></span>
   <button class="btn sm p" onclick="tAdd()">+ Bölüm ekle</button></div>
  <div class="bd">
   <div class="seclist" id="tsecs"></div>
   <div class="mini" style="margin-top:4px">⠿ ile sürükle ya da ↑ ↓ ile sırala. Sıra, dokümandaki bölüm sırasıdır.</div>

</div>
<div class="grid g2" style="margin-top:14px">
 <div class="card"><div class="hd"><h3>Doğrulama</h3><span class="sub">tasarımdan üretilen şema · fail-closed</span></div><div class="bd">

  <div class="kv"><span class="k">Son 30 gün</span><span>142 analiz</span>
  <span class="k">İlk seferde geçen</span><span class="tag t-green">%88</span>
  <span class="k">1 tekrarla geçen</span><span>%11</span>
  <span class="k">İnsana düşen</span><span>%1 (2 analiz)</span></div>
 </div></div>
 <div class="card"><div class="hd"><h3>Sürüm geçmişi</h3></div><div class="bd">
  ${[["v3","3 Ağu","Ayşe K.","'Risk ve geri dönüş' bölümüne geri alma adımı zorunluluğu eklendi"],
     ["v2","21 Tem","Ayşe K.","Etki analizi biçimi matrise çevrildi — fan-out buradan okunuyor"],
     ["v1","12 Tem","kurulum","7 bölümlü kurum standardı"]]
   .map(r=>`<div style="display:grid;grid-template-columns:40px 56px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px">
    <b class="mono">${r[0]}</b><span class="mini">${r[1]}</span><div>${r[3]}<div class="mini">${r[2]}</div></div></div>`).join("")}
 </div></div>
</div>
<div class="hint" style="margin-top:14px"><b>Sürüm pinleme (M83):</b> her akış <b>başladığı sürümle biter</b>. Bugün v${TVER+1} yayınlasan bile dün v${TVER} ile başlamış 2 açık akış v${TVER} ile tamamlanır; kullanılan sürüm no ticket'a ve kanıt paketine yazılır. "Hangi ticket hangi sürümle" raporu denetime hazır.</div>`});
function tRender(){tList();tEditor()}
function tList(){const el=$("#tsecs");if(!el)return;
 el.innerHTML=TSECS.map((s,i)=>`<div class="row ${s.id===TSEL?'sel':''}" onclick="tSel(${s.id})" title="düzenlemek için tıkla">
  <span class="gr" title="sürükleyerek sırala">⠿</span><span class="mini mono">${i+1}</span>
  <div style="flex:1;min-width:0">
   <div class="tt">${esc(s.t)}</div>
   <div class="mini"><span style="color:var(--${s.req?'red':'amber'});font-weight:600">${s.req?'zorunlu':'opsiyonel'}</span> · ${esc(s.fmt)}</div>
  </div>
  <div style="display:flex;gap:4px;flex:none">
   <button class="iconb" title="yukarı taşı" onclick="event.stopPropagation();tMove(${s.id},-1)">↑</button>
   <button class="iconb" title="aşağı taşı" onclick="event.stopPropagation();tMove(${s.id},1)">↓</button>
   <button class="iconb dl" title="bölümü sil" onclick="event.stopPropagation();tDel(${s.id})">✕</button>
  </div>
 </div>`).join("");
 const c=$("#tcount");if(c)c.textContent=TSECS.length}
function tEditor(){const el=$("#teditor");if(!el)return;
 const s=TSECS.find(x=>x.id===TSEL);
 if(!s){el.innerHTML=`<div class="bd"><div class="note">Soldan bir bölüm seç ya da yeni bölüm ekle.</div></div>`;return}
 const i=TSECS.indexOf(s);
 el.innerHTML=`<div class="hd"><h3>Bölüm ${i+1} · ${esc(s.t)}</h3><span class="sub">bu tanım ajana talimat, çıktı da buna göre doğrulanır</span></div>
 <div class="bd">
  <div class="grid g2" style="margin-bottom:12px">
   <div><label class="mini">Bölüm başlığı</label>
    <input class="inp" value="${esc(s.t)}" oninput="tSet(${s.id},'t',this.value);tList()"></div>
   <div><label class="mini">Beklenen biçim</label>
    <select class="sel" onchange="tSet(${s.id},'fmt',this.value);tEditor()">
     ${TFMT.map(f=>`<option${f===s.fmt?" selected":""}>${f}</option>`).join("")}</select></div>
  </div>
  <label class="mini">Açıklama — insanlar için (Studio'da ve dokümanda bölüm altında görünür)</label>
  <input class="inp" style="margin:4px 0 12px" value="${esc(s.d)}" oninput="tSet(${s.id},'d',this.value)">
