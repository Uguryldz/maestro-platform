# =============================================================================
# Maestro — registry kurulumu (imajlar registry'den ÇEKİLİR)
# BUNDLE_VERSION: 2026-08-27
# =============================================================================
# Bu compose HİÇBİR ŞEY BUILD ETMEZ ve hiçbir tar dosyası beklemez. Tüm imajlar
# `docker compose pull` ile registry'den çekilir (bkz. README.md §2).
#
# Banka paketinden (../banka/) farkı TEK maddedir: orada imajlar `docker load`
# ile sunucuya elle taşınır, burada registry'den çekilir. Sertleştirme,
# healthcheck'ler, açılış sırası ve değişkenlerin tamamı AYNIDIR — orada
# doğrulanmış bir yığın, buraya ayrı bir düzeltme borcu bırakmasın diye.
#
# ⚠ İMAJ ADRESLERİNİN ÖNEKİNİ SİZ VERİRSİNİZ. `.env`'deki MAESTRO_NODE_IMAGE /
#   MAESTRO_STUDIO_IMAGE satırlarına kendi registry'nizin tam adresini yazın
#   (`nexus.kurum.local/maestro/node:e22392a` gibi). Depoların registry'de nasıl
#   adlandırıldığı bu paketin bilgisi değildir; bu yüzden compose'da hiçbir
#   varsayılan önek YOKTUR — `:?` ile zorunludur ve boş bırakılırsa compose
#   değişkenin ADIYLA durur, yanlış bir imajı sessizce çekmeye çalışmaz.
#
# ⚠ BURADA OLMAYAN DEĞİŞKEN, KONTEYNERE GİRMEZ.
#   .env'de dolu olması yetmez: bir değişken aşağıdaki `environment:` bloğunda
#   ADIYLA yazılı değilse süreç onu hiç görmez. Bu, paketin geçmişte en pahalı
#   arıza biçimiydi — operatör .env'de değeri görür, sistem ise sanki hiç
#   yazılmamış gibi davranır. Yeni bir ayar eklerken .env.example'a yazmak
#   YARIM iştir; buraya da eklenmelidir.
#
# Kurulum:
#   cp .env.example .env && <doldur>
#   docker login <registry>
#   docker compose pull
#   ./install.sh
# =============================================================================

# Yığının adı. Konteyner, ağ ve VOLUME adlarının tamamı bunun önekiyle üretilir
# (`maestro_postgres-data` gibi), dolayısıyla bu satır "hangi veritabanı" demenin
# bir başka biçimidir.
#
# .env'den gelir ÇÜNKÜ aynı sunucuda ikinci bir kurulum (kabul/test ortamı,
# sürüm provası) yapmak sabit bir adla mümkün değildir: iki kurulum da `maestro`
# adını alır, compose ikincisini yeni bir yığın olarak değil MEVCUDUN GÜNCELLEMESİ
# olarak görür ve çalışan kurulumun volume'üne bağlanır. Sonuç, "yeni bir kurulum
# denedim" ile "üretim veritabanının üstüne kuruldum" arasındaki farkın
# kaybolmasıdır. Varsayılanı `maestro`'dur, yani tek kurulumlu bir sunucuda
# hiçbir şey değişmez.
name: ${COMPOSE_PROJECT_NAME:-maestro}

# ── Ortak sertleştirme ───────────────────────────────────────────────────────
# Değiştirmeyin: imajlar uid 10001 ile çalışır, kök dosya sistemine yazmaz.
x-node-hardening: &node-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging: &default-logging
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "10"

# ── Tüm Node servislerinin paylaştığı ortam ──────────────────────────────────
x-node-env: &node-env
  # NODE_ENV .env'den GELİR, burada sabitlenmez: sırlar env-file sürücüsüyle
  # okunur ve o sürücü NODE_ENV=production altında yapıcısında reddeder.
  # `production` yazmak, Vault + S3 katmanını da zorunlu kılar (bkz. .env §12).
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER gerekli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB gerekli}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}@redis:6379/0

  # Panelden girilen bağlantı jetonlarını şifreleyen anahtar. Bu paketin
  # merkezindeki değişken: Jira/GitHub/model jetonlarının hepsi panelden girilip
  # veritabanına BUNUNLA şifrelenir. Kendisi veritabanında duramaz — koruduğu
  # deponun içinde saklanan bir anahtar koruma sağlamaz — bu yüzden burada.
  CONNECTOR_MASTER_KEY: ${CONNECTOR_MASTER_KEY:?CONNECTOR_MASTER_KEY gerekli — openssl rand -base64 32}

  # Kurumsal TLS: Jira DC / TFS ya da kurum içi model sunucunuz kurum CA'sıyla
  # imzalıysa ŞART. Yoksa her çağrı sertifika hatasıyla düşer; panelin bağlantı
  # testi bunu "TLS sertifikası doğrulanamadı (<kod>)" diye adıyla söyler.
  NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}

  # ── İş takibi (Jira) ───────────────────────────────────────────────────────
  # HANGİ SÜRÜCÜ ÇALIŞACAĞINI BU İKİ ADRES BELİRLER — ayrı bir seçici yoktur
  # (apps/deploy/src/profile.ts, `workDriverFor`). Yalnızca birini doldurun:
  #   JIRA_BASE_URL       → Data Center sürücüsü (`Bearer <PAT>`)
  #   JIRA_CLOUD_BASE_URL → Cloud sürücüsü (`Basic <e-posta>:<jeton>`)
  # İkisi birden doluysa açılış ADIYLA reddedilir; hangisinin kazandığı tahmin
  # edilmez. İkisi de boşsa yığın yine AÇILIR (panel erişilebilir kalsın diye)
  # ve Jira'ya ilk erişimde "henüz tanımlanmadı" diye adıyla cevap verir.
  JIRA_BASE_URL: ${JIRA_BASE_URL:-}
  JIRA_CLOUD_BASE_URL: ${JIRA_CLOUD_BASE_URL:-}
  JIRA_TOKEN_REF: ${JIRA_TOKEN_REF:-kv/jira#token}
  JIRA_WEBHOOK_SECRET_REF: ${JIRA_WEBHOOK_SECRET_REF:-kv/jira#webhook}

  # ── Motorun Jira kimliği ───────────────────────────────────────────────────
  # Keşif sorgusu `assignee = "<MAESTRO_BOT_ACCOUNT_ID>"` ile çalışır; panel
  # ise dinleme kuralını BAĞLANTININ sahibiyle doldurur. İkisi ayrışırsa her
  # kural eşleşmeyen bir atanana bakar ve HİÇBİR HATA ÜRETMEDEN hiçbir şey
  # yakalamaz. İkisi de konteynere girmek zorundadır: BFF bu değeri yalnızca
  # bağlantı testinde karşılaştırıp uyarmak için okur ve değişken konteynere
  # ulaşmazsa uyarı da hiç çıkmaz. Boş bırakmak DESTEKLENEN hâldir — panel
  # jetonun gerçek sahibini `/rest/api/3/myself` ile öğrenip kendisi yazar.
  MAESTRO_BOT_ACCOUNT_ID: ${MAESTRO_BOT_ACCOUNT_ID:-}
  # Cloud'da Basic kimlik doğrulamanın kullanıcı adı. Boşsa kod
  # JIRA_CLOUD_EMAIL'e düşer (driver-config.ts) — canlıda iki kimliğin
  # ayrışma yolu tam olarak buydu.
  MAESTRO_BOT_EMAIL: ${MAESTRO_BOT_EMAIL:-}
  JIRA_CLOUD_EMAIL: ${JIRA_CLOUD_EMAIL:-}

  # ── Onay kapıları → Jira grupları ──────────────────────────────────────────
  # /approve kararı, karar verenin JİRA GRUBU üyeliğiyle doğrulanır
  # (apps/deploy/src/stores/gate-directory.ts). Eşleme boşsa ROL ADININ KENDİSİ
  # grup adı sayılır (product-owners, tech-leads, qa) — Jira'da o adda grup
  # YOKSA her onay "üye değil" diye reddedilir; kapı fail-closed'dır.
  # Biçim rol=grup, virgülle:
  #   GATE_GROUPS="product-owners=jira-po-grubu,tech-leads=jira-lider-grubu"
  # HEM bff HEM worker okumak ZORUNDADIR: bff üyeliği bu grupla doğrular,
  # worker kapı kaydına sahibi bu grupla yazar (bin/worker.ts). Yalnız birine
  # girerse gerçek bir onay bir süreçte kabul, diğerinde ret olur — bu yüzden
  # ortak blokta durur.
  GATE_GROUPS: ${GATE_GROUPS:-}
  # Tek onaycı gruplu saha için: eşlemede adı geçmeyen HER rol bu gruba düşer.
  GATE_GROUP_DEFAULT: ${GATE_GROUP_DEFAULT:-}

  # ── Kaynak kodu ────────────────────────────────────────────────────────────
  # scm portu GitHub sürücüsüdür ve HER kurulumda kuruludur. Hiçbir zorunlu
  # değişkeni yoktur: github.com varsayılandır, jeton ise panelden girilir ve
  # ilk çağrıda veritabanından okunur. GITHUB_TOKEN_REF bir sır ADRESİDİR.
  GITHUB_TOKEN_REF: ${GITHUB_TOKEN_REF:-kv/github#token}
  # Yalnızca GitHub Enterprise Server için; ikisi BİRLİKTE verilir. Boş
  # bırakılırsa github.com kullanılır.
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
  GITHUB_GRAPHQL_URL: ${GITHUB_GRAPHQL_URL:-}

  # Azure DevOps kullanan bir saha için; scm portu GitHub olduğundan bugün
  # okunmaz, ama CI tarafı yapılandırıldığında aynı adlardan okunur.
  ADO_BASE_URL: ${ADO_BASE_URL:-}
  ADO_ORG: ${ADO_ORG:-}
  ADO_PROJECT: ${ADO_PROJECT:-}
  ADO_PR_VALIDATION_BUILDS: ${ADO_PR_VALIDATION_BUILDS:-}
  ADO_TOKEN_REF: ${ADO_TOKEN_REF:-kv/ado#token}
  ADO_WEBHOOK_SECRET_REF: ${ADO_WEBHOOK_SECRET_REF:-kv/ado#webhook}

  # ── Yapay zekâ uç noktası ──────────────────────────────────────────────────
  # Model artık PANELDEN tanımlanır: "Ayarlar & bağlantılar" ekranında adres,
  # model adı, anahtar ve "kurum içinde çalışıyor" işareti birlikte girilir ve
  # kaydedildiği anda çalışan servisler onu kullanır — yeniden başlatma yok.
  #
  # Aşağıdaki üç değişken bu yüzden ARTIK ZORUNLU DEĞİL (`:?` kaldırıldı).
  # Boş bırakılabilir: hiç model tanımlanmamış bir kurulum AÇILIR ve ilk model
  # çağrısında adıyla ("henüz bir model tanımlanmadı") reddeder — panelin
  # açılabilmesi için servisin ayakta olması gerekir.
  #
  # Dolu bırakılırsa eski davranış aynen sürer: panelde model satırı yoksa bu
  # değerler kullanılır. Böylece hâlihazırda çalışan bir kurulum bu sürüme
  # geçtiğinde hiçbir şey değişmez.
  #
  # DİKKAT (dolduracaksanız): LLM_BASE_URL sonunda `/v1` OLMAYACAK — sürücü
  # kendisi ekler. Panele yazarken bu tuzak kendiliğinden temizlenir.
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY_REF: ${LLM_API_KEY_REF:-kv/llm#api-key}
  # Panelde tanımlı model için bu değişken OKUNMAZ; oradaki "kurum içinde
  # çalışıyor" işareti geçerlidir. Yalnız .env ile yapılandırılmış kurulumlarda
  # anlamını korur: false ise `gizli` sınıflı işler on-prem model yok sayılır
  # ve analiz "elle tamamlayın" diye biter — hata değil, EKSİK ÇIKTI.
  LLM_ON_PREM: ${LLM_ON_PREM:-true}

  # ── Kimlik (LDAP/AD) ───────────────────────────────────────────────────────
  # Varsayılan `local`: kurulum yerel hesapla başlar, LDAP sonradan devreye
  # alınır. `ldaps-bind` seçilirse LDAP_URL + LDAP_USER_BASE_DN + LDAP_BIND_DN
  # zorunlu olur ve süreç bunlarsız açılmaz.
  IDENTITY_DRIVER: ${IDENTITY_DRIVER:-local}
  LDAP_URL: ${LDAP_URL:-}
  # Kodun okuduğu ad LDAP_USER_BASE_DN'dir. `LDAP_BASE_DN` hiçbir şema
  # tarafından okunmaz: LDAP dolu görünüp hiç çalışmaz.
  LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-}
  LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD_REF: ${LDAP_BIND_PASSWORD_REF:-kv/ldap#service-password}
  LDAP_CA_CERT_PATH: ${LDAP_CA_CERT_PATH:-}
  LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
  LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-}
  LDAP_ROLE_MAPPINGS: ${LDAP_ROLE_MAPPINGS:-}

  # ── Vault (yalnızca NODE_ENV=production) ──────────────────────────────────
  # Sır sürücüsü ORTAM DEĞİŞKENİYLE SEÇİLMEZ; profilden gelir
  # (apps/deploy/src/profile.ts).
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
  VAULT_MOUNTS: ${VAULT_MOUNTS:-kv,git}

  # ── Depolama (yalnızca NODE_ENV=production) ───────────────────────────────
  # NODE_ENV=development iken belgeler Postgres'te tutulur (`pg-blob`).
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-maestro-evidence}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}

# Sır değerleri (env-file sürücüsü için). Ayrı anchor: yalnızca uygulama
# servislerine verilir, veritabanı/temporal konteynerlerine sızmaz.
#
# ⚠ BU ADLAR ELLE SEÇİLMEZ. Sürücü değişken adını referanstan türetir
#   (packages/secrets/src/keys.ts): `kv/jira#webhook` →
#   MAESTRO_SECRET_KV_JIRA__WEBHOOK, '#' ÇİFT alt çizgi, '-' ise `__2D_` olur.
#
# ⚠ Bu blok kısadır ve KISALIĞI bu paketin ana kazancıdır: Jira jetonu, GitHub
#   jetonu ve model anahtarı artık PANELDEN girilir, veritabanına şifreli yazılır
#   ve koşular oradan okur. Aşağıdakiler yalnızca panelde henüz bağlantı
#   tanımlanmamışken kullanılan YEDEK yoldur — webhook sırrı hariç (bkz. .env §9).
x-node-secrets: &node-secrets
  MAESTRO_SECRET_KV_JIRA__TOKEN: ${MAESTRO_SECRET_KV_JIRA__TOKEN:-}
  MAESTRO_SECRET_KV_JIRA__WEBHOOK: ${MAESTRO_SECRET_KV_JIRA__WEBHOOK:?MAESTRO_SECRET_KV_JIRA__WEBHOOK gerekli — openssl rand -hex 32}
  MAESTRO_SECRET_KV_LLM__API__2D_KEY: ${MAESTRO_SECRET_KV_LLM__API__2D_KEY:-}
  MAESTRO_SECRET_KV_GITHUB__TOKEN: ${MAESTRO_SECRET_KV_GITHUB__TOKEN:-}
  MAESTRO_SECRET_KV_ADO__TOKEN: ${MAESTRO_SECRET_KV_ADO__TOKEN:-}
  MAESTRO_SECRET_KV_ADO__WEBHOOK: ${MAESTRO_SECRET_KV_ADO__WEBHOOK:-}
  MAESTRO_SECRET_KV_LDAP__SERVICE__2D_PASSWORD: ${MAESTRO_SECRET_KV_LDAP__SERVICE__2D_PASSWORD:-}

# Kurumsal CA + LDAP CA dosyalarını salt-okunur mount et.
x-ca-volumes: &ca-volumes
  - ${CA_BUNDLE_DIR:-./certs}:/etc/maestro:ro

# CA dosyaları + depo klonlarının ortak çalışma alanı (yalnız bff ve worker).
# Kök dosya sistemi read-only, /tmp ise konteyner-BAŞINA tmpfs'tir — bff'in
# klonladığı depoyu worker orada göremezdi. Bu yüzden İKİ servise de AYNI yola
# bağlanan tek volume kullanılır: bff koşu başında depoyu oraya klonlar
# (bin/bff.ts, checkoutOrNull), worker analizde oradan okur
# (packages/workflows/src/impl/analysis.ts, workspacePath). WORKSPACE_ROOT
# boşken volume boş durur ve hiçbir şey değişmez.
x-workspace-volumes: &workspace-volumes
  - ${CA_BUNDLE_DIR:-./certs}:/etc/maestro:ro
  - maestro-workspace:/workspace

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Veri katmanı
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [maestro]

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    # Parolasız Redis, ağa açık bir kuyruktur. Parola ZORUNLU.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [maestro]

  temporal:
    image: ${TEMPORAL_IMAGE:?TEMPORAL_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [maestro]

  # ───────────────────────────────────────────────────────────────────────────
  # Şema kurulumu — BFF'ten ÖNCE çalışır ve bitmesi beklenir
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env) — registry öneki dahil tam adres}
    restart: "no"
    environment:
      <<: [*node-env, *node-secrets]
      # Tek imaj, üç rol: entrypoint env ile seçilir.
      MAESTRO_ENTRYPOINT: apps/deploy/dist/bin/migrate.js
      # İlk `admin` parolası. BOŞKEN rastgele üretilir ve migrate çıktısına
      # BİR KEZ basılır (önerilen). Runbook'u sabit ilk parola isteyen saha
      # burada verir; parola o zaman hiç basılmaz ve ilk girişte değişim yine
      # zorunludur (packages/db/src/seed-first-admin.ts). YALNIZ migrate okur;
      # bff/worker'a bilerek verilmez — parola yalnızca onu eken sürece girsin.
      MAESTRO_BOOTSTRAP_PASSWORD: ${MAESTRO_BOOTSTRAP_PASSWORD:-}
    volumes: *ca-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [maestro]

  # ───────────────────────────────────────────────────────────────────────────
  # Uygulama
  # ───────────────────────────────────────────────────────────────────────────
  bff:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env) — registry öneki dahil tam adres}
    environment:
      <<: [*node-env, *node-secrets]
      MAESTRO_ENTRYPOINT: apps/deploy/dist/bin/bff.js
      # 7001 SABİT — .env'den GELMEZ, ve bu bilinçli bir kısıtlamadır.
      #
      # Bu, BFF'in KONTEYNER İÇİNDEKİ dinleme portudur; dışarıya hiç
      # yayınlanmaz (`ports:` yalnızca studio'da vardır). Aynı 7001 sayısı iki
      # ayrı yerde daha SABİT durur: aşağıdaki healthcheck ve
      # studio-nginx.conf'taki `proxy_pass http://bff:7001/` satırı. Değişken
      # hâlindeyken .env'e BFF_PORT="17011" yazan bir kurulum şunu yaşadı:
      # süreç 17011'i dinledi, healthcheck 7001'i yokladı, konteyner hiç
      # 'healthy' olmadı ve studio ona bağımlı olduğu için hiç başlamadı.
      #
      # Dışarıya açılan tek port STUDIO_PORT'tur; değiştirilecek port odur.
      BFF_PORT: "7001"
      # Kodun varsayılanı 127.0.0.1'dir ve bu bilinçlidir: değişken unutulduğu
      # için 0.0.0.0'a bağlanan servis, ihmal yüzünden ağa açılmış demektir.
      # Konteyner içinde loopback'i studio'nun nginx'i göremez — panel açılır,
      # her istek 502 döner. Varsayılan burada 0.0.0.0'dır ÇÜNKÜ maruziyet
      # konteyner ağıyla sınırlıdır.
      BFF_HOST: ${BFF_HOST:-0.0.0.0}
      # Hiçbir dinleme kuralı eşleşmeyen ticket'ın düşeceği akış. BOŞKEN TAM
      # boru hattına düşülür (bin/bff.ts, flowOf) — yalnız analiz kullanan bir
      # saha .env'de "analiz" vererek bunu daraltabilir. Tanınmayan değer yok
      # sayılır (analiz | duzeltme | gelistirme). Yalnız BFF okur.
      MAESTRO_FLOW: ${MAESTRO_FLOW:-}
      # Jira yorum komutlarını (/approve) YOKLAMAYLA okuma aralığı, milisaniye.
      # Boş/0 → kapalı. Webhook'u çalışan kurulum AÇMASIN — aynı yorum iki kez
      # işlenir. Jira Cloud'da webhook imzası doğrulanamadığından /approve'un
      # ticket'tan işlenebilmesinin TEK yolu budur (bin/bff.ts, startJiraPoller).
      JIRA_POLL_MS: ${JIRA_POLL_MS:-}
      JIRA_DISCOVER_MS: ${JIRA_DISCOVER_MS:-}
      # ── Depo keşfi (opsiyonel; boşken analiz depoyu görmeden yapılır) ──────
      # BFF koşu başlarken depoyu BURAYA klonlar (bin/bff.ts, checkoutOrNull);
      # worker aynı yoldan okur — maestro-workspace volume'ü bu yüzden ikisine
      # de bağlıdır. Açmak için .env'de WORKSPACE_ROOT="/workspace" yazın.
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-}
      # Özel depo için jetonun sır ADRESİ (örn. kv/github#token — değer o
      # zaman MAESTRO_SECRET_KV_GITHUB__TOKEN'dan okunur). github.com dışı bir
      # SCM için SCM_HOST. İkisi de boşken github.com + anonim klon denenir.
      SCM_TOKEN_REF: ${SCM_TOKEN_REF:-}
      SCM_HOST: ${SCM_HOST:-}
    volumes: *workspace-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # /readyz — Temporal ve kill-switch deposunu da yoklar; "süreç ayakta mı"
      # değil "istek çalışır mı" sorusunu yanıtlar.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [maestro]

  worker:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env) — registry öneki dahil tam adres}
    environment:
      <<: [*node-env, *node-secrets]
      MAESTRO_ENTRYPOINT: apps/deploy/dist/bin/worker.js
      # Sağlık ucunun portu. Yalnız konteyner içinde dinlenir (dışarı
      # AÇILMAZ): tek tüketicisi aşağıdaki healthcheck'tir.
      WORKER_HEALTH_PORT: "7002"
    # workspace dahil: analiz aktiviteleri bff'in klonladığı depoyu
    # workspacePath'ten okur — mount olmadan yol worker'da hiç var olmaz.
    volumes: *workspace-volumes
    depends_on:
      temporal: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Canlılık = KUYRUĞU YOKLUYOR, "süreç ayakta" değil.
    #
    # Eskiden burada `test: ["NONE"]` vardı ve worker'ı yalnız
    # `restart: unless-stopped` koruyordu — o da SÜRECİN ölmesine tepki verir.
    # Sahayı asıl kilitleyen arıza bunun tersi: worker ayakta ama artık iş
    # alamıyor (Temporal bağlantısı düşüp geri gelmiyor, yoklama takılıyor).
    # Docker'ın gördüğü her ölçüde sağlıklıdır, kuyruk dolar, son başarılı
    # koşudan sonra log'a tek satır düşmez ve analiz "hiç bitmez".
    #
    # WORKER_HEALTH_PORT ucu tam bunu söyler: RUNNING'e ulaşana kadar 503,
    # ulaştığında 200. Yeniden başlatmayı 'autoheal' servisi yapar —
    # compose'un kendisi sağlık durumuna göre restart ETMEZ.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      # Workflow paketini derleyip Temporal'a bağlanması bu kadar sürebilir;
      # daha kısa bir pencere sağlıklı bir worker'ı açılışta öldürürdü.
      start_period: 120s
    networks: [maestro]

  # ── Otomatik iyileşme ───────────────────────────────────────────────────────
  # Compose sağlık durumuna göre konteyner YENİDEN BAŞLATMAZ:
  # `restart: unless-stopped` yalnız süreç ölünce devreye girer. Analiz
  # kurulumunu asıl kilitleyen arıza ise bunun tersi — worker ayakta ama artık
  # iş alamıyor. Healthcheck bunu görür, Docker `unhealthy` yazar ve sonra
  # HİÇBİR ŞEY olmaz. Bu servis o halkayı kapatır.
  #
  # Yalnız BU yığının konteynerlerini kurtarır (compose proje etiketi) ve tek
  # bildiği fiil "restart"tır: yaratmaz, silmez, yapılandırma değiştirmez.
  # Docker soketi salt-okunur bağlanır.
  autoheal:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env) — registry öneki dahil tam adres}
    environment:
      MAESTRO_ENTRYPOINT: apps/deploy/dist/bin/autoheal.js
      # Filtrenin kapsamı. Boş kalırsa süreç açılmaz — adsız bir filtre
      # HOSTTAKİ HER konteyneri kapsardı, ki bu asla olmamalı.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-maestro}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # Soketin GRUBUNA ek üyelik. Konteyner uid 10001 ile koşar (paylaşılan
    # sertleştirme), soket ise root:docker sahiplidir — üyelik olmadan her
    # çağrı EACCES alır ve autoheal hiçbir şeyi kurtaramaz. Ölçüldü: ilk
    # sürüm tam olarak böyle sessizce işe yaramıyordu.
    #
    # gid HOSTA GÖRE DEĞİŞİR. Kendi sunucunuzunkini şöyle bulun:
    #   stat -c '%g' /var/run/docker.sock
    # ve .env'de DOCKER_GID olarak verin. Yanlış/boş bırakılırsa autoheal
    # kendini kapatmaz; olay akışı koptu diye loglar — sessiz kalmaz.
    group_add:
      - ${DOCKER_GID:-999}
    healthcheck:
      test: ["NONE"]
    networks: [maestro]

  studio:
    image: ${MAESTRO_STUDIO_IMAGE:?MAESTRO_STUDIO_IMAGE gerekli (.env) — registry öneki dahil tam adres}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    # Tarayıcı /api/... çağırır, BFF ise kökten servis eder (/auth/login).
    # Bu conf öneki soyup bff'e yönlendirir. Dev'de bu işi Vite yapıyordu;
    # üretimde nginx yapar. Dosya olmadan panel açılır ama HİÇBİR istek çalışmaz.
    volumes:
      - ./studio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${STUDIO_PORT:-7000}:8080"
    networks: [maestro]

volumes:
  postgres-data:
  redis-data:
  # Depo klonlarının ÇALIŞMA alanı — veri değil (kalıcı her şey Postgres'te).
  # tmpfs + uid=10001 BİLİNÇLİ bir seçimdir: imajlar kök yazmayan uid 10001
  # ile koşar ve sıradan bir named volume root sahipli doğar — klon daha ilk
  # mkdir'de EACCES ile düşer, analiz de sessizce depsuz kalırdı. tmpfs,
  # uid'i bağlarken verebilen taşınabilir tek yoldur; bedeli, yeniden
  # başlatmada klonların silinmesidir — klon zaten en-iyi-çabadır ve bff
  # gerektiğinde yeniden klonlar. 1g sınırı RAM'i korur; sığmayan klon analizi
  # düşürmez, "depo çekilemedi" uyarısıyla depsuz sürer.
  maestro-workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1g,uid=10001,gid=10001,mode=0770,noexec,nosuid"

networks:
  maestro:
    driver: bridge
